<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Países | MasterDiv Desk</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        'primary-navy': '#0D1B2A',
                        'secondary-navy': '#1E293B',
                        'primary-blue': '#2563EB',
                        'accent-cyan': '#06B6D4',
                        'success-green': '#10B981',
                        surface: '#F1F5F9'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/theme.js"></script>
    <script src="js/modal-behavior.js"></script>
</head>

<body data-page="countries">

<div class="min-h-screen">

    <aside id="sidebar"></aside>

    <main class="flex-1 p-5 md:p-8 min-w-0">

        <div class="mb-8">
            <h2 class="text-3xl font-bold" style="color: var(--text-primary);">
                Gestión de Países
            </h2>

            <p class="field-help">
                Administra los países disponibles para la creación de tickets
            </p>
        </div>

        <div class="space-y-6">

            <div class="card">
                <h3 class="card-title mb-4" style="font-size: var(--font-size-base);">
                    Nuevo País
                </h3>

                <form id="countryForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <select
                        id="countrySelect"
                        class="select"
                        required
                    >
                        <option value="">Seleccione un país de Latinoamérica</option>
                    </select>

                    <button
                        class="btn btn-primary btn-block">
                        <i data-lucide="plus" class="icon-sm"></i>
                        Agregar País
                    </button>

                </form>
            </div>

            <div class="card">

                <div class="flex justify-between items-center mb-5">
                    <div>
                        <h3 class="card-title" style="font-size: var(--font-size-base);">
                            Países Registrados
                        </h3>

                        <p class="field-help">
                            Países disponibles para el selector de creación de tickets
                        </p>
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="table min-w-[800px]">

                        <thead>
                            <tr>
                                <th>Bandera</th>
                                <th>País</th>
                                <th>Código</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="countriesList"></tbody>

                    </table>
                </div>

            </div>

        </div>

    </main>

</div>

<div id="deleteCountryModal" class="hidden modal-overlay fixed inset-0 flex items-center justify-center p-4">
    <div class="modal-panel" style="max-width: 28rem;">
        <div class="modal-body">

            <h3 class="text-2xl font-bold mb-2" style="color: var(--text-primary);">
                Eliminar país
            </h3>

            <p id="deleteCountryText" class="field-help mb-5"></p>

            <input type="hidden" id="deleteCountryId">

            <div class="flex justify-end gap-3">
                <button onclick="closeDeleteCountryModal()" class="btn btn-outline">
                    Cancelar
                </button>

                <button
                    onclick="confirmDeleteCountry()"
                    class="btn btn-danger">
                    Eliminar
                </button>
            </div>

        </div>
    </div>
</div>
<div
    id="duplicateCountryModal"
    class="hidden modal-overlay fixed inset-0 flex items-center justify-center p-4">

    <div
        id="duplicateCountryModalContent"
        class="modal-panel" style="max-width: 28rem;">
        <div class="modal-body">

            <h3 class="text-2xl font-bold mb-2" style="color: var(--text-primary);">
                País ya registrado
            </h3>

            <p id="duplicateCountryText" class="field-help mb-5">
                Este país ya se encuentra registrado.
            </p>

            <div class="flex justify-end">
                <button
                    onclick="closeDuplicateCountryModal()"
                    class="btn btn-primary">
                    Entendido
                </button>
            </div>

        </div>
    </div>
</div>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/countries.js"></script>

<script>
    renderLayout('countries');
    lucide.createIcons();
</script>

</body>
</html>
