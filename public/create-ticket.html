<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Ticket | MasterDiv Desk</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        'primary-navy': '#0D1B2A',
                        'secondary-navy': '#1E293B',
                        'primary-blue': '#2563EB',
                        'accent-cyan': '#06B6D4',
                        'success-green': '#10B981',
                        surface: '#F1F5F9'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/theme.js"></script>
    <script src="js/modal-behavior.js"></script>
</head>

<body data-page="create-ticket">

<div class="min-h-screen">

<aside id="sidebar"></aside>

    <main class="flex-1 p-5 md:p-8 min-w-0">
        <div class="mb-8">
            <h2 class="text-3xl font-bold" style="color: var(--text-primary);">Crear nuevo ticket</h2>
            <p class="field-help">Registra una solicitud o incidente de soporte técnico</p>
        </div>

        <div class="card card-lg w-full">
            <form id="ticketForm" class="space-y-6 max-w-7xl mx-auto">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>
                        <label class="field-label">Tipo de reporte</label>
                        <select id="typeId" class="select" required></select>
                    </div>
                    <div>
                        <label class="field-label">
                            Servicio afectado
                        </label>

                        <select
                            id="ticketSubtypeId"
                            class="select"
                            required
                        >
                            <option value="">Seleccione un servicio afectado</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label">Asunto</label>
                        <input id="subject" type="text" class="input" required>
                    </div>

                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>
                        <label class="field-label">
                            País de donde requiere el soporte
                        </label>

                        <select
                            id="countryId"
                            required
                            class="select">
                            <option value="">Cargando países...</option>
                        </select>
                    </div>

                    <div>
                        <label class="field-label">Asignado a</label>
                        <select id="assignedTo" class="select" required></select>
                    </div>

                </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


                        <div>
                            <label class="field-label">Descripción</label>

                            <textarea
                                id="description"
                                rows="4"
                                class="textarea"
                                required></textarea>
                        </div>

                    </div>
                <div>
                    <label class="field-label">
                        Evidencias / Archivos adjuntos
                    </label>

                    <div
                        id="createDropZone"
                        class="rounded-2xl p-6 text-center cursor-pointer transition"
                        style="border: 2px dashed var(--border-strong);">

                        <i data-lucide="upload-cloud" class="mx-auto mb-3" style="color: var(--text-muted); width: 32px; height: 32px;"></i>

                        <p class="font-semibold" style="color: var(--text-secondary);">
                            Arrastra evidencias aquí
                        </p>

                        <p class="text-sm mt-1" style="color: var(--text-muted);">
                            o haz clic para seleccionar varios archivos
                        </p>

                        <input
                            id="createFileInput"
                            type="file"
                            multiple
                            class="hidden"
                        >
                    </div>

                    <div
                        id="createSelectedFilesList"
                        class="mt-4 space-y-2">
                    </div>

                    <p
                        id="createAttachmentMessage"
                        class="mt-3 text-sm">
                    </p>
                </div>
                <div class="flex justify-center">

                    <button
                        class="btn btn-primary btn-lg" style="padding-left: var(--space-8); padding-right: var(--space-8);">
                        Crear Ticket
                    </button>

                </div>

                <p id="message" class="hidden text-sm font-semibold"></p>

            </form>
        </div>
    </main>

</div>

<div id="successTicketModal" class="hidden modal-overlay fixed inset-0 flex items-center justify-center p-4 z-50">
    <div class="modal-panel text-center" style="max-width: 28rem;">
        <div class="modal-body">

            <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5" style="background-color: rgba(16, 185, 129, 0.14); color: var(--color-success-green);">
                <i data-lucide="check" class="icon-lg"></i>
            </div>

            <h3 class="text-2xl font-bold mb-2" style="color: var(--text-primary);">
                Ticket creado correctamente
            </h3>

            <p id="createdTicketNumber" class="field-help mb-6"></p>

            <div class="rounded-2xl p-5 mb-6" style="background-color: var(--surface-card-alt);">

                <p class="text-sm mb-3" style="color: var(--text-muted);">
                    Responsable asignado
                </p>

                <div class="flex items-center justify-center gap-3">

                    <div id="assignedAdminAvatar"
                         class="w-14 h-14 rounded-full text-white flex items-center justify-center font-bold"
                         style="background-color: var(--color-primary-navy);">
                    </div>

                    <div class="text-left">
                        <p id="assignedAdminName" class="font-bold" style="color: var(--text-primary);"></p>
                        <p id="assignedAdminJob" class="text-sm" style="color: var(--text-muted);"></p>
                    </div>

                </div>

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                <button
                    onclick="goAfterTicketCreated()"
                    class="btn btn-primary btn-block">
                    Ir al Dashboard
                </button>

                <button
                    onclick="goToCreatedTicket()"
                    class="btn btn-outline btn-block">
                    Ver Ticket
                </button>

            </div>

        </div>
    </div>
</div>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/create-ticket.js"></script>
<script>
    renderLayout('create-ticket');
    lucide.createIcons();
</script>
</body>
</html>
