<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Usuarios | MasterDiv Desk</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        'primary-navy': '#0D1B2A',
                        'secondary-navy': '#1E293B',
                        'primary-blue': '#2563EB',
                        'accent-cyan': '#06B6D4',
                        'success-green': '#10B981',
                        surface: '#F1F5F9'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/theme.js"></script>
    <script src="js/modal-behavior.js"></script>
</head>

<body data-page="users">

<div class="min-h-screen">

<aside id="sidebar"></aside>

    <main class="flex-1 p-5 md:p-8 min-w-0">

        <div class="mb-8">

            <h2 class="text-3xl font-bold" style="color: var(--text-primary);">
                Administración de Usuarios
            </h2>

            <p class="field-help">
                Gestión de usuarios del sistema
            </p>

        </div>

<div class="space-y-6">

    <div class="card">

        <h3 class="card-title mb-4" style="font-size: var(--font-size-base);">
            Nuevo Usuario
        </h3>

        <form id="userForm" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">

            <input
                id="name"
                type="text"
                placeholder="Nombre y Apellido"
                class="input"
                required
            >

            <input
                id="department"
                type="text"
                placeholder="Departamento"
                class="input"
            >

            <input
                id="jobTitle"
                type="text"
                placeholder="Cargo / Puesto"
                class="input"
            >

            <input
                id="email"
                type="email"
                placeholder="Correo electrónico"
                class="input"
                required
            >

            <input
                id="phone"
                type="text"
                placeholder="Celular"
                class="input"
            >

            <input
                id="password"
                type="password"
                placeholder="Contraseña"
                class="input"
                required
            >

            <select
                id="role"
                class="select">

                <option value="USER">
                    Usuario
                </option>

                <option value="AGENT">
                    Agente
                </option>

                <option value="TENANT_ADMIN">
                    Administrador
                </option>

            </select>

            <button
                class="btn btn-primary btn-block">
                <i data-lucide="user-plus" class="icon-sm"></i>
                Crear Usuario
            </button>

        </form>

    </div>

    <div class="card">

        <div class="flex justify-between items-center mb-5">
            <div>
                <h3 class="card-title" style="font-size: var(--font-size-base);">
                    Usuarios Registrados
                </h3>

                <p class="field-help">
                    Administración de cuentas, roles y estado de acceso
                </p>
            </div>
        </div>

        <div class="table-scroll-hint xl:hidden">
            <i data-lucide="move-horizontal" class="icon-sm"></i>
            <span>Desliza para ver más columnas</span>
        </div>

        <div class="table-wrap">
            <table class="table min-w-[1100px]">

                <thead>
                    <tr>
                        <th class="whitespace-nowrap">Usuario</th>
                        <th class="whitespace-nowrap">Departamento</th>
                        <th class="whitespace-nowrap">Cargo</th>
                        <th class="whitespace-nowrap">Correo</th>
                        <th class="whitespace-nowrap">Celular</th>
                        <th class="whitespace-nowrap">Rol</th>
                        <th class="whitespace-nowrap">Estado</th>
                        <th class="whitespace-nowrap">Acciones</th>
                    </tr>
                </thead>

                <tbody id="usersList"></tbody>

            </table>
        </div>

    </div>

</div>

    </main>

</div>
<div id="editModal" class="hidden modal-overlay fixed inset-0 flex items-center justify-center p-4">
    <div class="modal-panel">
        <div class="modal-body">

            <h3 class="text-2xl font-bold mb-5" style="color: var(--text-primary);">Editar Usuario</h3>

            <input type="hidden" id="editUserId">

            <div class="space-y-4">
                <input id="editName" type="text" placeholder="Nombre" class="input">
                <input id="editDepartment" type="text" placeholder="Departamento" class="input">
                <input id="editJobTitle" type="text" placeholder="Cargo" class="input">
                <input id="editEmail" type="email" placeholder="Correo" class="input">
                <input id="editPhone" type="text" placeholder="Celular" class="input">

                <select id="editRole" class="select">
                    <option value="USER">Usuario</option>
                    <option value="AGENT">Agente</option>
                    <option value="TENANT_ADMIN">Administrador</option>
                </select>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeEditModal()" class="btn btn-outline">
                    Cancelar
                </button>

                <button onclick="saveUserChanges()" class="btn btn-primary">
                    Guardar cambios
                </button>
            </div>

        </div>
    </div>
</div>
<div id="passwordModal" class="hidden modal-overlay fixed inset-0 flex items-center justify-center p-4">
    <div class="modal-panel" style="max-width: 28rem;">
        <div class="modal-body">

            <h3 class="text-2xl font-bold mb-2" style="color: var(--text-primary);">Resetear contraseña</h3>

            <p id="passwordModalUser" class="field-help mb-5"></p>

            <input type="hidden" id="passwordUserId">

            <input
                id="newPassword"
                type="password"
                placeholder="Nueva contraseña"
                class="input mb-4"
            >

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirmar contraseña"
                class="input mb-4"
            >

            <p id="passwordMessage" class="hidden text-sm mb-4"></p>

            <div class="flex justify-end gap-3">
                <button onclick="closePasswordModal()" class="btn btn-outline">
                    Cancelar
                </button>

                <button onclick="saveNewPassword()" class="btn btn-primary">
                    Guardar contraseña
                </button>
            </div>

        </div>
    </div>
</div>
<div id="statusModal" class="hidden modal-overlay fixed inset-0 flex items-center justify-center p-4">
    <div class="modal-panel" style="max-width: 28rem;">
        <div class="modal-body">

            <h3 id="statusModalTitle" class="text-2xl font-bold mb-2" style="color: var(--text-primary);">
                Confirmar acción
            </h3>

            <p id="statusModalText" class="field-help mb-5"></p>

            <input type="hidden" id="statusUserId">

            <div class="flex justify-end gap-3">
                <button onclick="closeStatusModal()" class="btn btn-outline">
                    Cancelar
                </button>

                <button
                    id="confirmStatusBtn"
                    onclick="confirmToggleUser()"
                    class="btn"
                    style="color: #fff;">
                    Confirmar
                </button>
            </div>

        </div>
    </div>
</div>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/users.js"></script>
<script>
    renderLayout('users');
    lucide.createIcons();
</script>
</body>
</html>
