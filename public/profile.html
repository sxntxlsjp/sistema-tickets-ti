<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | MasterDiv Desk</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        'primary-navy': '#0D1B2A',
                        'secondary-navy': '#1E293B',
                        'primary-blue': '#2563EB',
                        'accent-cyan': '#06B6D4',
                        'success-green': '#10B981',
                        surface: '#F1F5F9'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/theme.js"></script>
    <script src="js/modal-behavior.js"></script>
</head>

<body data-page="profile">

<div class="min-h-screen">

    <aside id="sidebar"></aside>

    <main class="flex-1 p-5 md:p-8 min-w-0">

        <div class="mb-8">

            <h2 class="text-3xl font-bold" style="color: var(--text-primary);">
                Mi Perfil
            </h2>

            <p class="field-help">
                Administra tu información personal y seguridad.
            </p>

        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

            <!-- TARJETA PERFIL -->
            <div class="card card-lg">

                <div class="flex flex-col items-center">

                <div class="relative mb-5">

                    <img
                        id="profileImage"
                        class="hidden w-32 h-32 rounded-full object-cover border-4 shadow-lg"
                        style="border-color: var(--surface-sunken);"
                    >

                    <div
                        id="profileAvatar"
                        class="w-32 h-32 rounded-full text-white text-4xl font-bold flex items-center justify-center"
                        style="background-color: var(--color-primary-navy);">
                    </div>

                </div>

                    <div class="flex flex-col items-center gap-3">

                        <label
                            class="btn btn-secondary btn-sm cursor-pointer">
                            <i data-lucide="camera" class="icon-sm"></i>
                            Seleccionar foto

                            <input
                                id="profilePhotoInput"
                                type="file"
                                accept="image/*"
                                class="hidden">
                        </label>

                        <button
                            id="savePhotoBtn"
                            class="hidden btn btn-success btn-sm">
                            Guardar foto
                        </button>

                        <p
                            id="photoUploadMessage"
                            class="text-sm" style="color: var(--text-muted);">
                        </p>

                    </div>

                    <h3 id="profileName"
                        class="text-2xl font-bold text-center mt-4" style="color: var(--text-primary);">
                    </h3>

                    <p id="profileJobTitle"
                       class="field-help text-center">
                    </p>

                    <p id="profileDepartment"
                       class="text-sm text-center mt-1" style="color: var(--text-muted);">
                    </p>

                </div>

            </div>

            <!-- DATOS -->
            <div class="xl:col-span-2 card card-lg">

                <h3 class="card-title mb-6" style="font-size: var(--font-size-base);">
                    Información Personal
                </h3>

                <form id="profileForm" class="space-y-5">

                    <div>
                        <label class="field-label">
                            Nombre completo
                        </label>

                        <input
                            id="name"
                            type="text"
                            class="input"
                        >
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                        <div>
                            <label class="field-label">
                                Departamento
                            </label>

                            <input
                                id="department"
                                type="text"
                                class="input"
                                readonly
                            >
                        </div>

                        <div>
                            <label class="field-label">
                                Cargo
                            </label>

                            <input
                                id="jobTitle"
                                type="text"
                                class="input"
                                readonly
                            >
                        </div>

                    </div>

                    <div>
                        <label class="field-label">
                            Correo electrónico
                        </label>

                        <input
                            id="email"
                            type="email"
                            class="input"
                            readonly
                        >
                    </div>

                    <div>
                        <label class="field-label">
                            Teléfono
                        </label>

                        <input
                            id="phone"
                            type="text"
                            class="input"
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Guardar cambios
                    </button>

                </form>
                <hr class="my-8" style="border-color: var(--border-default);">

                <h3 class="card-title mb-6" style="font-size: var(--font-size-base);">
                    Seguridad
                </h3>

                <form id="passwordForm" class="space-y-5">

                    <div>
                        <label class="field-label">
                            Contraseña actual
                        </label>

                        <input
                            id="currentPassword"
                            type="password"
                            class="input"
                        >
                    </div>

                    <div>
                        <label class="field-label">
                            Nueva contraseña
                        </label>

                        <input
                            id="newPassword"
                            type="password"
                            class="input"
                        >
                    </div>

                    <div>
                        <label class="field-label">
                            Confirmar nueva contraseña
                        </label>

                        <input
                            id="confirmPassword"
                            type="password"
                            class="input"
                        >
                    </div>

                    <div
                        id="passwordMessage"
                        class="hidden rounded-xl p-4 text-sm">
                    </div>

                    <button
                        type="submit"
                        class="btn" style="background-color: var(--color-secondary-navy); color: #fff;">
                        Actualizar contraseña
                    </button>

                </form>
            </div>

        </div>

    </main>

</div>

<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>

<script>
    renderLayout('profile');
    lucide.createIcons();
</script>

</body>
</html>
