<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Empresas | MasterDiv Desk</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        'primary-navy': '#0D1B2A',
                        'secondary-navy': '#1E293B',
                        'primary-blue': '#2563EB',
                        'accent-cyan': '#06B6D4',
                        'success-green': '#10B981',
                        surface: '#F1F5F9'
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/theme.js"></script>
    <script src="js/modal-behavior.js"></script>
</head>

<body data-page="tenants">

<div class="min-h-screen">

    <aside id="sidebar"></aside>

    <main class="p-5 md:p-8 min-w-0">

        <div class="mb-8">
            <h2 class="text-3xl font-bold" style="color: var(--text-primary);">
                Empresas
            </h2>
            <p class="field-help">
                Administra las empresas clientes de MasterDiv Desk
            </p>
        </div>

        <div class="space-y-6">

            <div class="card">
                <h3 class="card-title mb-4" style="font-size: var(--font-size-base);">
                    Nueva Empresa
                </h3>

                <form id="tenantForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input
                        id="name"
                        type="text"
                        placeholder="Nombre de la empresa"
                        class="input"
                        required
                    >

                    <input
                        id="slug"
                        type="text"
                        placeholder="Identificador (opcional, ej: provefabrica-ecuador)"
                        class="input md:col-span-2"
                    >

                    <button
                        class="btn btn-primary btn-block">
                        <i data-lucide="plus" class="icon-sm"></i>
                        Crear Empresa
                    </button>
                </form>
            </div>

            <div class="card">
                <div class="flex justify-between items-center mb-5">
                    <div>
                        <h3 class="card-title" style="font-size: var(--font-size-base);">
                            Empresas Registradas
                        </h3>
                        <p class="field-help">
                            Accede, edita o activa/desactiva cada empresa
                        </p>
                    </div>
                </div>

                <div id="tenantsList" class="space-y-4"></div>
            </div>

        </div>

    </main>

</div>

<div id="editTenantModal" class="hidden modal-overlay fixed inset-0 flex items-center justify-center p-4 z-50">
    <div class="modal-panel">
        <div class="modal-body">

            <h3 class="text-2xl font-bold mb-5" style="color: var(--text-primary);">Editar Empresa</h3>

            <input type="hidden" id="editTenantId">

            <div class="space-y-4">
                <input
                    id="editTenantName"
                    type="text"
                    placeholder="Nombre de la empresa"
                    class="input"
                >

                <input
                    id="editTenantLegalName"
                    type="text"
                    placeholder="Razón social"
                    class="input"
                >

                <input
                    id="editTenantTaxId"
                    type="text"
                    placeholder="RUC / Tax ID"
                    class="input"
                >
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeEditTenantModal()" class="btn btn-outline">
                    Cancelar
                </button>

                <button onclick="saveTenantChanges()" class="btn btn-primary">
                    Guardar cambios
                </button>
            </div>

        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/tenants.js"></script>

<script>
    renderLayout('tenants');
    lucide.createIcons();
</script>

</body>
</html>
