<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas | MasterDiv Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100" data-page="tenants">

<div class="min-h-screen">

    <aside id="sidebar"></aside>

    <main class="p-8 min-w-0">

        <div class="mb-8">
            <h2 class="text-3xl font-bold text-slate-800">
                Empresas
            </h2>
            <p class="text-slate-500">
                Administra las empresas clientes de MasterDiv Desk
            </p>
        </div>

        <div class="space-y-6">

            <div class="bg-white rounded-2xl shadow p-6">
                <h3 class="text-xl font-bold mb-4">
                    Nueva Empresa
                </h3>

                <form id="tenantForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input
                        id="name"
                        type="text"
                        placeholder="Nombre de la empresa"
                        class="w-full border rounded-xl p-3"
                        required
                    >

                    <input
                        id="slug"
                        type="text"
                        placeholder="Identificador (opcional, ej: provefabrica-ecuador)"
                        class="w-full border rounded-xl p-3 md:col-span-2"
                    >

                    <button
                        class="w-full bg-slate-900 text-white py-3 rounded-xl hover:bg-slate-800">
                        Crear Empresa
                    </button>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow p-6">
                <div class="flex justify-between items-center mb-5">
                    <div>
                        <h3 class="text-xl font-bold">
                            Empresas Registradas
                        </h3>
                        <p class="text-slate-500 text-sm">
                            Accede, edita o activa/desactiva cada empresa
                        </p>
                    </div>
                </div>

                <div id="tenantsList" class="space-y-4"></div>
            </div>

        </div>

    </main>

</div>

<div id="editTenantModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg">

        <h3 class="text-2xl font-bold mb-5">Editar Empresa</h3>

        <input type="hidden" id="editTenantId">

        <div class="space-y-4">
            <input
                id="editTenantName"
                type="text"
                placeholder="Nombre de la empresa"
                class="w-full border rounded-xl p-3"
            >

            <input
                id="editTenantLegalName"
                type="text"
                placeholder="Razón social"
                class="w-full border rounded-xl p-3"
            >

            <input
                id="editTenantTaxId"
                type="text"
                placeholder="RUC / Tax ID"
                class="w-full border rounded-xl p-3"
            >
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button onclick="closeEditTenantModal()" class="px-4 py-2 border rounded-xl">
                Cancelar
            </button>

            <button onclick="saveTenantChanges()" class="px-4 py-2 bg-slate-900 text-white rounded-xl">
                Guardar cambios
            </button>
        </div>

    </div>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/tenants.js"></script>

<script>
    renderLayout('tenants');
</script>

</body>
</html>
